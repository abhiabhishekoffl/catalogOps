```yaml
name: CatalogOps CD

on:
  workflow_run:
    workflows: ["CatalogOps CI"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version to deploy (e.g. 2.7)"
        required: true
        type: string

jobs:
  docker:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read
      actions: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Download release version
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: release-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release artifact
        id: release_check
        shell: bash
        run: |
          if [ -f "release-version/release-version.txt" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read release version
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        id: release
        shell: bash
        run: |
          VERSION=$(cat release-version/release-version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Configure AWS credentials
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::469683586220:role/CatalogOps-GitHub-SSM-Role
          aws-region: us-east-1

      - name: Log in to Docker Hub
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker build \
            -t abhiabhishekoffl/catalogops:${VERSION} \
            -t abhiabhishekoffl/catalogops:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker push abhiabhishekoffl/catalogops:${VERSION}
          docker push abhiabhishekoffl/catalogops:latest

      - name: Encode Compose file
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          base64 -w 0 compose.yml > compose.yml.b64
          echo "Compose file encoded successfully."

      - name: Deploy to EC2 via SSM
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ steps.release.outputs.version }}"
          fi

          echo "Deploying version: $VERSION"

          COMPOSE_B64=$(cat compose.yml.b64)

          PARAMETERS=$(jq -n \
            --arg version "$VERSION" \
            --arg compose_b64 "$COMPOSE_B64" \
            '{
              commands: [
                "cd /home/ubuntu/catalogops",
                "CURRENT_IMAGE=$(docker inspect catalogops-container --format \"{{.Config.Image}}\")",
                "CURRENT_VERSION=${CURRENT_IMAGE##*:}",
                "echo Current image: $CURRENT_IMAGE",
                "echo Current version: $CURRENT_VERSION",
                "echo New version: \($version)",
                "echo Updating Compose file",
                "echo \($compose_b64) | base64 -d > compose.yml",
                "export CATALOGOPS_VERSION=\($version)",
                "docker compose config > /tmp/catalogops-compose-check.yml",
                "echo Compose configuration is valid",
                "if ! docker compose pull catalogops; then echo Docker image pull failed; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",
                "if docker compose up -d --force-recreate catalogops; then echo New container started; else echo Deployment failed; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",
                "sleep 5",
                "if curl --fail --silent http://localhost:8000/health | grep -q \"\\\"status\\\":\\\"healthy\\\"\"; then echo Health check passed; else echo Health check failed; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",
                "LOG_DRIVER=$(docker inspect catalogops-container --format \"{{.HostConfig.LogConfig.Type}}\")",
                "MAX_SIZE=$(docker inspect catalogops-container --format \"{{index .HostConfig.LogConfig.Config \\\"max-size\\\"}}\")",
                "MAX_FILE=$(docker inspect catalogops-container --format \"{{index .HostConfig.LogConfig.Config \\\"max-file\\\"}}\")",
                "echo Log driver: $LOG_DRIVER",
                "echo Max size: $MAX_SIZE",
                "echo Max file: $MAX_FILE",
                "if [ \"$LOG_DRIVER\" = \"json-file\" ] && [ \"$MAX_SIZE\" = \"10m\" ] && [ \"$MAX_FILE\" = \"3\" ]; then echo Log rotation check passed; else echo Log rotation check failed; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",
                "docker image prune -f",
                "echo Deployment completed successfully"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "SSM deployment command completed."

      - name: Public health check
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 10 \
            http://${{ secrets.EC2_HOST }}/health

          echo "Public health check passed."
```
