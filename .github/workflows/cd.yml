```yaml
name: CatalogOps CD

on:
  workflow_run:
    workflows: ["CatalogOps CI"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version to deploy (e.g. 2.7)"
        required: true
        type: string

jobs:
  docker:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read
      actions: read

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Get version for manual deployment
      # --------------------------------------------------
      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=""
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Initial version: ${VERSION:-not set}"


      # --------------------------------------------------
      # 3. Download release version artifact
      # --------------------------------------------------
      - name: Download release version
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: release-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------
      # 4. Check whether this is a release
      # --------------------------------------------------
      - name: Check release artifact
        id: release_check
        shell: bash
        run: |
          if [ -f "release-version/release-version.txt" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi


      # --------------------------------------------------
      # 5. Read release version
      # --------------------------------------------------
      - name: Read release version
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        id: release
        shell: bash
        run: |
          VERSION=$(cat release-version/release-version.txt)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"


      # --------------------------------------------------
      # 6. Encode compose.yml
      #
      # This allows GitHub Actions to transfer the
      # Compose file to EC2 through SSM.
      # --------------------------------------------------
      - name: Encode Compose file
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          base64 -w 0 compose.yml > compose.yml.b64

          echo "Compose file encoded successfully."


      # --------------------------------------------------
      # 7. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::469683586220:role/CatalogOps-GitHub-SSM-Role
          aws-region: us-east-1


      # --------------------------------------------------
      # 8. Login to Docker Hub
      # --------------------------------------------------
      - name: Log in to Docker Hub
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------
      # 9. Build Docker image
      #
      # Only release tags build a new image.
      # Manual deployment reuses an existing image.
      # --------------------------------------------------
      - name: Build Docker image
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker build \
            -t abhiabhishekoffl/catalogops:${VERSION} \
            -t abhiabhishekoffl/catalogops:latest \
            .


      # --------------------------------------------------
      # 10. Push Docker image
      # --------------------------------------------------
      - name: Push Docker image
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker push abhiabhishekoffl/catalogops:${VERSION}
          docker push abhiabhishekoffl/catalogops:latest


      # --------------------------------------------------
      # 11. Deploy to EC2 through SSM
      # --------------------------------------------------
      - name: Deploy to EC2 via SSM
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |

          # ----------------------------------------------
          # Determine version
          # ----------------------------------------------
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ steps.release.outputs.version }}"
          fi

          echo "Deploying Docker image version: $VERSION"


          # ----------------------------------------------
          # Read encoded compose file
          # ----------------------------------------------
          COMPOSE_B64=$(cat compose.yml.b64)


          # ----------------------------------------------
          # Create SSM command parameters
          # ----------------------------------------------
          PARAMETERS=$(jq -n \
            --arg version "$VERSION" \
            --arg compose_b64 "$COMPOSE_B64" \
            '{
              commands: [

                "cd /home/ubuntu/catalogops",

                "echo Starting CatalogOps deployment...",

                "CURRENT_IMAGE=$(docker inspect catalogops-container --format \"{{.Config.Image}}\")",

                "CURRENT_VERSION=${CURRENT_IMAGE##*:}",

                "echo Current image: $CURRENT_IMAGE",

                "echo Current version: $CURRENT_VERSION",

                "echo New version: \($version)",


                "echo Updating Compose file...",

                "echo \($compose_b64) | base64 -d > compose.yml",

                "echo Compose file updated successfully.",


                "echo Validating Compose configuration...",

                "export CATALOGOPS_VERSION=\($version)",

                "docker compose config > /tmp/catalogops-compose-check.yml",

                "echo Compose configuration is valid.",


                "echo Pulling Docker image...",

                "if ! docker compose pull catalogops; then echo Docker image pull failed - rolling back; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",


                "echo Starting new container...",

                "if docker compose up -d --force-recreate catalogops; then echo New container started successfully; else echo New deployment failed - rolling back; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",


                "echo Waiting for application...",

                "sleep 5",


                "echo Running health check...",

                "if curl --fail --silent http://localhost:8000/health | grep -q \"\\\"status\\\":\\\"healthy\\\"\"; then echo Health check passed; else echo Health check failed - rolling back; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",


                "echo Checking Docker log rotation...",

                "LOG_DRIVER=$(docker inspect catalogops-container --format \"{{.HostConfig.LogConfig.Type}}\")",

                "MAX_SIZE=$(docker inspect catalogops-container --format \"{{index .HostConfig.LogConfig.Config \\\"max-size\\\"}}\")",

                "MAX_FILE=$(docker inspect catalogops-container --format \"{{index .HostConfig.LogConfig.Config \\\"max-file\\\"}}\")",

                "echo Log driver: $LOG_DRIVER",

                "echo Max size: $MAX_SIZE",

                "echo Max file: $MAX_FILE",


                "if [ \"$LOG_DRIVER\" = \"json-file\" ] && [ \"$MAX_SIZE\" = \"10m\" ] && [ \"$MAX_FILE\" = \"3\" ]; then echo Docker log rotation check passed; else echo Docker log rotation check failed - rolling back; export CATALOGOPS_VERSION=$CURRENT_VERSION; docker compose up -d --force-recreate catalogops; exit 1; fi",


                "echo Cleaning unused Docker images...",

                "docker image prune -f",


                "echo Deployment completed successfully."
              ]
            }')


          # ----------------------------------------------
          # Send SSM command
          # ----------------------------------------------
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID: $COMMAND_ID"


          # ----------------------------------------------
          # Wait for SSM command
          # ----------------------------------------------
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"


          echo "EC2 deployment command completed."


      # --------------------------------------------------
      # 12. Public health check
      # --------------------------------------------------
      - name: Health check
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        run: |

          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 10 \
            http://${{ secrets.EC2_HOST }}/health

          echo "Public health check passed."
```
