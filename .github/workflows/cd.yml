name: CatalogOps CD

on:
  workflow_run:
    workflows: ["CatalogOps CI"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version to deploy (e.g. 1.9)"
        required: true
        type: string

jobs:
  docker:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read
      actions: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=""
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Initial version: ${VERSION:-not set}"

      - name: Download release version
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: release-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release version
        if: github.event_name == 'workflow_run'
        id: release
        shell: bash
        run: |
          VERSION=$(cat release-version/release-version.txt)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::469683586220:role/CatalogOps-GitHub-SSM-Role
          aws-region: us-east-1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'workflow_run'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker build \
            -t abhiabhishekoffl/catalogops:${VERSION} \
            -t abhiabhishekoffl/catalogops:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'workflow_run'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker push abhiabhishekoffl/catalogops:${VERSION}
          docker push abhiabhishekoffl/catalogops:latest

      - name: Deploy to EC2 via SSM
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ steps.release.outputs.version }}"
          fi

          echo "Deploying Docker image version: $VERSION"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/catalogops",
              "CURRENT_IMAGE=$(docker inspect catalogops-container --format '{{.Config.Image}}')",
              "echo Current image: $CURRENT_IMAGE",
              "export CATALOGOPS_VERSION='"$VERSION"'",
              "docker compose pull catalogops",
              "docker compose up -d catalogops",
              "sleep 5",
              "if curl --fail --silent http://localhost:8000/health > /dev/null; then echo Health check passed; else echo Health check failed - rolling back; docker compose down; export CATALOGOPS_VERSION=$(echo $CURRENT_IMAGE | cut -d: -f2); docker compose up -d catalogops; exit 1; fi",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "Deployment completed successfully."

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 5 --connect-timeout 10 http://${{ secrets.EC2_HOST }}/health