name: CatalogOps CD

on:
  workflow_run:
    workflows:
      - CatalogOps CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: Docker image version to deploy
        required: true
        type: string

jobs:
  docker:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read
      actions: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Download release version
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-version
          path: release-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release artifact
        id: release_check
        shell: bash
        run: |
          if [ -f "release-version/release-version.txt" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read release version
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        id: release
        shell: bash
        run: |
          VERSION=$(cat release-version/release-version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Configure AWS credentials
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::469683586220:role/CatalogOps-GitHub-SSM-Role
          aws-region: us-east-1

      - name: Log in to Docker Hub
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker build \
            -t abhiabhishekoffl/catalogops:${VERSION} \
            -t abhiabhishekoffl/catalogops:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'workflow_run' && steps.release_check.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          docker push abhiabhishekoffl/catalogops:${VERSION}
          docker push abhiabhishekoffl/catalogops:latest

      - name: Prepare Compose file
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          base64 -w 0 compose.yml > compose.b64
          echo "Compose file prepared."

      - name: Deploy to EC2
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ steps.release.outputs.version }}"
          fi

          COMPOSE_B64=$(cat compose.b64)

          PARAMETERS=$(jq -n \
            --arg version "$VERSION" \
            --arg compose "$COMPOSE_B64" \
            '{
              commands: [
                "cd /home/ubuntu/catalogops",
                "echo Updating Compose file...",
                ("echo " + $compose + " | base64 -d > compose.yml"),
                ("export CATALOGOPS_VERSION=" + $version),
                "docker compose -f compose.yml config",
                "echo Compose configuration validated.",
                "docker compose -f compose.yml pull catalogops",
                "docker compose -f compose.yml up -d --force-recreate catalogops",
                "sleep 5",
                "curl --fail --silent http://localhost:8000/health",
                "echo",
                "echo Health check passed.",
                "docker inspect catalogops-container --format '{{.Config.Image}}'",
                "docker inspect catalogops-container --format '{{.HostConfig.LogConfig.Type}} {{json .HostConfig.LogConfig.Config}}'",
                "docker image prune -f",
                "echo Deployment completed successfully."
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "EC2 deployment completed."

      - name: Public health check
        if: >
          (github.event_name == 'workflow_run' &&
           steps.release_check.outputs.is_release == 'true') ||
          github.event_name == 'workflow_dispatch'
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 10 \
            http://${{ secrets.EC2_HOST }}/health

          echo "Public health check passed."